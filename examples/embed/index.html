<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulse embed example</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, sans-serif; color: #f4f1ec; background: #0b0b0d; }
      #pulse { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: -1; pointer-events: none; }
      main { width: min(420px, calc(100% - 32px)); padding: 24px; border-radius: 16px; background: rgb(11 11 13 / 0.55); backdrop-filter: blur(16px); }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 16px; color: #b9b4ac; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      button, input, select { font: inherit; color: inherit; background: rgb(255 255 255 / 0.08); border: 1px solid rgb(255 255 255 / 0.15); border-radius: 8px; padding: 8px 12px; }
      button { cursor: pointer; }
    </style>
  </head>
  <body>
    <!-- Background visuals. Change mode, palette and quality in the URL -->
    <iframe id="pulse" title="Pulse visuals" src="/?embed&mode=halo&palette=standard&quality=high"></iframe>
    <audio id="music" loop preload="auto"></audio>

    <main>
      <h1>Pulse embed example</h1>
      <p>The page plays its own music, embed.js analyses it and Pulse reacts in the background.</p>
      <div class="row">
        <button id="play" type="button">Play</button>
        <input id="file" type="file" accept="audio/*" />
      </div>
    </main>

    <script src="/embed.js"></script>
    <script>
      // ?src=<audio url> picks the track, ?pulse=<url> points the iframe at another Pulse host
      const q = new URLSearchParams(location.search);
      const music = document.getElementById('music');
      const frame = document.getElementById('pulse');
      if (q.get('pulse')) frame.src = q.get('pulse');
      if (q.get('src')) music.src = q.get('src');

      const pulse = Pulse.connect(music, frame);
      window.pulse = pulse;

      const play = document.getElementById('play');
      play.addEventListener('click', () => (music.paused ? music.play() : music.pause()));
      music.addEventListener('play', () => (play.textContent = 'Pause'));
      music.addEventListener('pause', () => (play.textContent = 'Play'));
      document.getElementById('file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        music.src = URL.createObjectURL(file);
        void music.play();
      });
    </script>
  </body>
</html>
