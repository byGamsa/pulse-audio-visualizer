name: Release

# Ein Tag vX.Y.Z baut alle Desktop-Pakete und hängt sie an das GitHub-Release.
# Die Dateinamen tragen keine Version, damit releases/latest/download/<Datei> stabil bleibt.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.6.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Create draft release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          cat > notes.md <<'NOTES'
          ## Installation

          | System | File |
          | --- | --- |
          | Windows x64 | `Pulse_x64-setup.exe` (or `Pulse_x64_en-US.msi`) |
          | Windows ARM | `Pulse_arm64-setup.exe` |
          | macOS Apple Silicon | `Pulse_aarch64.dmg` |
          | macOS Intel | `Pulse_x64.dmg` |
          | Linux | `Pulse_amd64.AppImage`, `Pulse_amd64.deb` or `Pulse.x86_64.rpm` |

          macOS: the app is not notarized. On first launch right-click Pulse → Open, or allow it under System Settings → Privacy & Security.

          NOTES
          gh release create "$TAG" --draft --verify-tag --title "Pulse $TAG" --notes-file notes.md --generate-notes

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libpulse-dev rpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Upload to release
        shell: bash
        run: |
          v="${TAG#v}"
          dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir out
          for f in "$dir"/nsis/*.exe "$dir"/msi/*.msi "$dir"/dmg/*.dmg "$dir"/appimage/*.AppImage "$dir"/deb/*.deb "$dir"/rpm/*.rpm; do
            [ -f "$f" ] || continue
            n="$(basename "$f")"
            n="${n/_${v}_/_}"    # Pulse_0.6.0_x64-setup.exe -> Pulse_x64-setup.exe
            n="${n/-${v}-1./.}"  # Pulse-0.6.0-1.x86_64.rpm  -> Pulse.x86_64.rpm
            cp "$f" "out/$n"
          done
          ls -l out
          gh release upload "$TAG" out/* --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
