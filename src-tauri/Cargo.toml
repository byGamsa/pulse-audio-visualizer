[package]
name = "pulse"
version = "0.6.0"
description = "Real-time audio visualizer"
edition = "2021"

[lib]
name = "pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rustfft = "6"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Media_Control", "Foundation", "Storage_Streams", "Win32_System_WinRT"] }

[profile.release]
lto = true
codegen-units = 1
